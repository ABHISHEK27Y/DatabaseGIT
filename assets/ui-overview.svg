<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-label="Overview dashboard">
  <defs>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
    </style>
  </defs>
  <rect width="1000" height="640" fill="#f6f4ee"/>

  <!-- header -->
  <line x1="0" y1="60" x2="1000" y2="60" stroke="#e6e2d7"/>
  <rect x="22" y="16" width="28" height="28" rx="7" fill="#fff" stroke="#1a5f4a" stroke-width="1.5"/>
  <text x="36" y="36" text-anchor="middle" class="serif" font-size="17" font-weight="600" fill="#1a5f4a">T</text>
  <text x="62" y="31" class="serif" font-size="17" font-weight="600" fill="#1c1b18">Database Time Machine</text>
  <text x="62" y="47" class="sans" font-size="10" letter-spacing="1.5" fill="#7b786f">VERSION HISTORY FOR YOUR DATA</text>
  <rect x="852" y="18" width="126" height="24" rx="12" fill="#fff" stroke="#e6e2d7"/>
  <text x="915" y="34" text-anchor="middle" class="sans" font-size="11" fill="#7b786f">1 table tracked</text>

  <!-- sidebar -->
  <line x1="190" y1="60" x2="190" y2="640" stroke="#e6e2d7"/>
  <text x="24" y="96" class="sans" font-size="10" letter-spacing="2" fill="#a7a399">VIEWS</text>
  <g class="sans" font-size="13.5" fill="#413f39">
    <rect x="12" y="112" width="166" height="30" rx="8" fill="#e9f1ec"/>
    <rect x="12" y="112" width="2.5" height="30" fill="#1a5f4a"/>
    <text x="24" y="132" fill="#1a5f4a" font-weight="600">Overview</text>
    <text x="24" y="166">Timeline</text>
    <text x="24" y="200">Time travel</text>
    <text x="24" y="234">Compare</text>
    <text x="24" y="268">Attribution</text>
    <text x="24" y="302">Schema</text>
    <text x="24" y="336">Checkpoints</text>
    <text x="24" y="370">Branches</text>
    <text x="24" y="404">Anomalies</text>
    <text x="24" y="438">Integrity</text>
  </g>

  <!-- heading -->
  <text x="224" y="104" class="serif" font-size="26" font-weight="600" fill="#1c1b18">Overview</text>
  <text x="224" y="128" class="sans" font-size="13" fill="#7b786f">A complete record of everything that has happened to this database ·
    <tspan fill="#1a5f4a" font-weight="600">✓ integrity verified</tspan>.</text>

  <!-- stat cards -->
  <g transform="translate(224,150)">
    <rect x="0" y="0" width="754" height="128" rx="12" fill="#e6e2d7"/>
    <!-- row 1 -->
    <rect x="1" y="1" width="187" height="63" fill="#fff"/>
    <rect x="189" y="1" width="187" height="63" fill="#fff"/>
    <rect x="377" y="1" width="188" height="63" fill="#fff"/>
    <rect x="566" y="1" width="187" height="63" fill="#fff"/>
    <!-- row 2 -->
    <rect x="1" y="65" width="187" height="62" fill="#fff"/>
    <rect x="189" y="65" width="187" height="62" fill="#fff"/>
    <rect x="377" y="65" width="188" height="62" fill="#fff"/>
    <rect x="566" y="65" width="187" height="62" fill="#fdfcf9"/>

    <text x="20" y="40" class="serif" font-size="32" font-weight="600" fill="#1a5f4a">6</text>
    <text x="20" y="56" class="sans" font-size="10" letter-spacing="1" fill="#7b786f">TOTAL CHANGES</text>
    <text x="208" y="40" class="serif" font-size="32" font-weight="600" fill="#1c1b18">6</text>
    <text x="208" y="56" class="sans" font-size="10" letter-spacing="1" fill="#7b786f">COMMITS</text>
    <text x="396" y="40" class="serif" font-size="32" font-weight="600" fill="#1c1b18">1</text>
    <text x="396" y="56" class="sans" font-size="10" letter-spacing="1" fill="#7b786f">TABLES</text>
    <text x="585" y="40" class="serif" font-size="32" font-weight="600" fill="#1c1b18">1</text>
    <text x="585" y="56" class="sans" font-size="10" letter-spacing="1" fill="#7b786f">CHECKPOINTS</text>

    <text x="20" y="103" class="serif" font-size="32" font-weight="600" fill="#1c1b18">3</text>
    <text x="20" y="119" class="sans" font-size="10" letter-spacing="1" fill="#7b786f">INSERTS</text>
    <text x="208" y="103" class="serif" font-size="32" font-weight="600" fill="#1c1b18">2</text>
    <text x="208" y="119" class="sans" font-size="10" letter-spacing="1" fill="#7b786f">UPDATES</text>
    <text x="396" y="103" class="serif" font-size="32" font-weight="600" fill="#1c1b18">1</text>
    <text x="396" y="119" class="sans" font-size="10" letter-spacing="1" fill="#7b786f">DELETES</text>
  </g>

  <!-- by author panel -->
  <g transform="translate(224,300)">
    <rect x="0" y="0" width="368" height="300" rx="12" fill="#fff" stroke="#e6e2d7"/>
    <text x="22" y="34" class="serif" font-size="15" font-weight="600" fill="#1c1b18">By author</text>
    <text x="22" y="54" class="sans" font-size="12" fill="#7b786f">Who has made changes.</text>
    <g class="sans" font-size="13" fill="#413f39">
      <text x="22" y="96">carol</text>
      <rect x="150" y="90" width="150" height="6" rx="3" fill="#efece3"/>
      <rect x="150" y="90" width="150" height="6" rx="3" fill="#1a5f4a" opacity="0.85"/>
      <text x="336" y="96" text-anchor="end" fill="#7b786f">2</text>
      <text x="22" y="136">bob</text>
      <rect x="150" y="130" width="150" height="6" rx="3" fill="#efece3"/>
      <rect x="150" y="130" width="150" height="6" rx="3" fill="#1a5f4a" opacity="0.85"/>
      <text x="336" y="136" text-anchor="end" fill="#7b786f">2</text>
      <text x="22" y="176">alice</text>
      <rect x="150" y="170" width="150" height="6" rx="3" fill="#efece3"/>
      <rect x="150" y="170" width="150" height="6" rx="3" fill="#1a5f4a" opacity="0.85"/>
      <text x="336" y="176" text-anchor="end" fill="#7b786f">2</text>
    </g>
  </g>

  <!-- by table panel -->
  <g transform="translate(610,300)">
    <rect x="0" y="0" width="368" height="300" rx="12" fill="#fff" stroke="#e6e2d7"/>
    <text x="22" y="34" class="serif" font-size="15" font-weight="600" fill="#1c1b18">By table</text>
    <text x="22" y="54" class="sans" font-size="12" fill="#7b786f">Where changes landed.</text>
    <text x="22" y="96" class="sans" font-size="13" fill="#413f39">users</text>
    <rect x="150" y="90" width="150" height="6" rx="3" fill="#efece3"/>
    <rect x="150" y="90" width="150" height="6" rx="3" fill="#1a5f4a" opacity="0.85"/>
    <text x="336" y="96" text-anchor="end" class="sans" font-size="13" fill="#7b786f">6</text>
  </g>
</svg>
