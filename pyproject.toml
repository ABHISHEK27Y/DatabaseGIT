[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "database-time-machine"
version = "0.2.0"
description = "Git-style history and time travel for SQLite databases."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abhishek Yadav" }]
keywords = ["sqlite", "audit", "time-travel", "database", "versioning", "history"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Database",
    "Intended Audience :: Developers",
]
# Core has ZERO runtime dependencies -- standard library only.
dependencies = []

[project.optional-dependencies]
# Only needed for the (optional) server backends.
postgres = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]

[project.scripts]
dtm = "dtm.cli:main"

[project.urls]
Homepage = "https://github.com/ABHISHEK27Y/DatabaseGIT"

[tool.setuptools]
packages = ["dtm"]
